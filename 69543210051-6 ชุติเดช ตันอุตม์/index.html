<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card-container">
    <header class="card-header">
      <div>
      <h1 class="title">สมัคร</h1>
      <p class="subtitle">ง่ายและเร็ว</p>
      </div>
      <button type="button" class="btn-close" aria-label="ปิด">X</button>
    </header>

    <form class="signup-form">
      
      <div class="form-row grid-2">
      <input type="text" placeholder="ชื่อ" class="input-field" required>
      <input type="text" placeholder="นามสกุล" class="input-field" required>
      </div>

      <div class="form-group">
      <input type="text" placeholder="หมายเลขโทรศัพท์มือถือหรืออีเมล" class="input-field" required>
      </div>
      <div class="form-group">
      <input type="password" placeholder="รหัสผ่านใหม่" class="input-field" required>
      </div>

      <div class="form-group">
        <label class="field-label">วันเกิด</label>
        <div class="form-row grid-3">
          <select class="select-field" aria-label="วัน">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
            <option>21</option>
            <option>22</option>
            <option>23</option>
            <option>24</option>
            <option>25</option>
            <option>26</option>
            <option>27</option>
            <option>28</option>
            <option>29</option>
            <option>30</option>
            <option>31</option>
          </select>
          <select class="select-field" aria-label="เดือน">
            <option>ม.ค.</option>
            <option>ก.พ.</option>
            <option>มี.ค.</option>
            <option>เม.ย.</option>
            <option>พ.ค.</option>
            <option>มิ.ย.</option>
            <option>ก.ค.</option>
            <option>ส.ค.</option>
            <option>ก.ย.</option>
            <option>ต.ค.</option>
            <option>พ.ย.</option>
            <option>ธ.ค.</option>
          </select>
          <select class="select-field" aria-label="ปี">
            <option>2005</option>
            <option>2006</option>
            <option>2007</option>
            <option>2008</option>
            <option>2009</option>
            <option>2010</option>
            <option>2011</option>
            <option>2012</option>
            <option>2013</option>
            <option>2014</option>
            <option>2015</option>
            <option>2016</option>
            <option>2017</option>
            <option>2018</option>
            <option>2019</option>
            <option>2020</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="field-label">เพศ</label>
        <div class="form-row grid-2">
          <label class="gender-option">
          <span>หญิง</span>
          <input type="radio" name="gender" value="female">
          </label>
          <label class="gender-option">
          <span>ชาย</span>
          <input type="radio" name="gender" value="male">
          </label>
        </div>
      </div>
      <p class="terms-text">
      เมื่อคลิก สมัคร แสดงว่าคุณยอมรับข้อกำหนด นโยบายข้อมูล และนโยบายคุกกี้ของเรา คุณอาจได้รับการแจ้งเตือนทาง SMS จากเรา และสามารถเลือกไม่รับได้ในภายหลัง
      </p>
      <button type="submit" class="btn-submit">สมัคร</button>
    </form>
  </main>
</body>
</html>
